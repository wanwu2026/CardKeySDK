plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cardkeydemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.cardkeydemo.xposed"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    def ciStoreFile = System.getenv("CARDKEY_KEYSTORE")
    signingConfigs {
        ci {
            if (ciStoreFile) {
                storeFile file(ciStoreFile)
                storePassword System.getenv("CARDKEY_STOREPASS")
                keyAlias System.getenv("CARDKEY_KEYALIAS")
                keyPassword System.getenv("CARDKEY_KEYPASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ciStoreFile) {
                signingConfig signingConfigs.ci
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':sdk')
    compileOnly 'de.robv.android.xposed:api:82'
}
