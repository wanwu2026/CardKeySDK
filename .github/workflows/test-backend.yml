name: Test Demo Backend

on:
  push:
    branches: [demo-backend]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成测试用 RSA 密钥
        run: |
          mkdir -p backend/keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out backend/keys/private.pem 2>/dev/null
          openssl rsa -in backend/keys/private.pem -pubout -out backend/keys/public.pem 2>/dev/null

      - name: 运行后端端到端测试
        run: python3 backend/test_server.py

      - name: 运行签发工具单元测试
        run: python3 tools/test_cardkey_tool.py
