name: Build Xposed Module APK

on:
  push:
    branches: [xposed-injection-module]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMGR" ]; then echo "未找到 sdkmanager（SDKROOT=$SDKROOT）" >&2; exit 1; fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "Android SDK 组件就绪（platform 34 / build-tools 34.0.0）"

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成临时签名密钥（仅用于 CI 出包）
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/cardkey-demo.jks" \
            -storepass cardkeydemo -keypass cardkeydemo \
            -alias demo -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CardKey Demo, OU=Open Source, O=CardKey, L=Unknown, ST=Unknown, C=CN" >/dev/null 2>&1
          echo "CARDKEY_KEYSTORE=$RUNNER_TEMP/cardkey-demo.jks" >> "$GITHUB_ENV"
          echo "CARDKEY_STOREPASS=cardkeydemo" >> "$GITHUB_ENV"
          echo "CARDKEY_KEYPASS=cardkeydemo" >> "$GITHUB_ENV"
          echo "CARDKEY_KEYALIAS=demo" >> "$GITHUB_ENV"
          echo "临时密钥已生成（随 runner 销毁，不进仓库）"

      - name: 运行 Java 单元测试
        run: gradle :sdk:testDebugUnitTest --no-daemon --stacktrace

      - name: 编译 Release APK
        run: gradle :demo:assembleRelease --no-daemon --stacktrace

      - name: 定位并规范化 APK 文件名
        run: |
          APK=$(find demo/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "未找到 APK" >&2; exit 1; fi
          cp "$APK" "$GITHUB_WORKSPACE/CardKeyXposed-release.apk"
          echo "APK 路径: $APK"
          echo "APK 大小: $(du -h "$GITHUB_WORKSPACE/CardKeyXposed-release.apk" | cut -f1)"
          unzip -p "$GITHUB_WORKSPACE/CardKeyXposed-release.apk" AndroidManifest.xml >/dev/null 2>&1 \
            && echo "APK 结构校验: 通过"

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: CardKeyXposed-apk
          path: CardKeyXposed-release.apk
          if-no-files-found: error

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xposed-demo-latest
          name: CardKey Xposed Module APK（最新构建）
          body: |
            Xposed 注入式模块，由 GitHub Actions 自动编译，已用临时密钥签名。需先安装 Xposed 框架。
            演示卡密见 `demo/demo_license.txt`（免设备绑定，2035 年到期）。

            > 这是**演示包**，签名密钥每次构建都重新生成且随 runner 销毁。
            > 自己发布正式模块请用你自己的密钥，见 `docs/keygen.md`。
          files: CardKeyXposed-release.apk
          preserve_existing_tag: true
